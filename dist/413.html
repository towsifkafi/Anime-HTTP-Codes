<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>413 Payload Too Large</title>
    <style>* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #222222;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Trebuchet MS', sans-serif;
    padding: 2rem;
}

.container {
    text-align: center;
    max-width: 600px;
}

.image-box {
    margin-bottom: 2rem;
}

.image-box img {
    max-width: 15em;
    border: 3px solid white;
    border-radius: 8px;
}

h1 {
    font-size: 4rem;
    color: white;
    margin-bottom: 0.5rem;
}

h2 {
    font-size: 1.5rem;
    color: #ccc;
}

/* index */
body.index-page {
    display: block;
    padding: 2rem 1.5rem 3rem;
}

.index-header {
    display: flex;
    justify-content: space-between;
    flex-direction: row;
    align-items: center;
    max-width: 720px;
    margin: 0 auto 2.5rem;
}

.index-header h1 {
    font-size: 2.5rem;
    color: white;
    margin-bottom: 0.5rem;
}

.index-header p {
    color: #aaa;
    font-size: 1.1rem;
}

.index-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1.5rem;
    max-width: 1200px;
    margin: 0 auto;
}

.code-card {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    background: #2a2a2a;
    border: 2px solid #444;
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
}

.code-card:hover {
    border-color: white;
    transform: translateY(-4px);
}

.code-card__image {
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: #1a1a1a;
}

.code-card__image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.code-card__info {
    padding: 1rem;
    text-align: center;
}

.code-card__code {
    display: block;
    font-size: 1.75rem;
    font-weight: bold;
    color: white;
    margin-bottom: 0.25rem;
}

.code-card__name {
    display: block;
    font-size: 0.95rem;
    color: #aaa;
}</style>
</head>
<body>
    <div class="container">
        <div class="image-box">
            <img src="https://cdn.shopify.com/s/files/1/0318/2649/files/tenor_ef8ea3ac-40cd-42b8-9afd-5ea82e47d745_large.gif?v=1563938313" alt="Payload Too Large" />
        </div>
        <h1>413</h1>
        <h2>Payload Too Large</h2>
    </div>
</body>
</html>
